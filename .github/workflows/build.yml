name: Build mod from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unzip sources
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip с исходниками"; exit 1; fi
          echo "Распаковываю $ZIP"
          mkdir -p src_unpacked
          unzip -q -o "$ZIP" -d src_unpacked
          GRADLE_FILE=$(find src_unpacked -maxdepth 3 -name build.gradle | head -n1)
          if [ -z "$GRADLE_FILE" ]; then echo "В архиве не найден build.gradle"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Build jar
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Collect jar
        run: |
          mkdir -p out
          find "$PROJECT_DIR/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: realcars-jar
          path: out/*.jar
